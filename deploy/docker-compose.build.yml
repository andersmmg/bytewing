# Deployment that builds from source rather than pulling a published image.
#
# Used while there is no release: what runs is exactly what is on the branch,
# which is what a trial deployment should be testing.

services:
  bytewing:
    build:
      # Relative to this file, so the context is the repository root.
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BYTEWING_APP_URL: ${BYTEWING_APP_URL}
      BYTEWING_CONTENT_URL: ${BYTEWING_CONTENT_URL}
      BYTEWING_DATA_DIR: /data
      BYTEWING_CONFIG_DIR: /config
    volumes:
      - ${BYTEWING_HOST_DATA}:/data
      - bytewing-config:/config
    expose:
      - "8080"

volumes:
  bytewing-config:
